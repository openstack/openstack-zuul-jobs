- project-template:
    name: python-charm-jobs
    description: |
      Run Python tests for charm projects.
      This run py2.7 job and supposed to be used
      on stable branch until stable/train. Ussuri
      onwards, py3 template should be used
      (DEPRECATED FOR REMOVAL).
    check:
      jobs:
        - openstack-tox-pep8
        - openstack-tox-py27
    gate:
      jobs:
        - openstack-tox-pep8
        - openstack-tox-py27

